name: CI Verification

on:
  push:
    branches: ['main', 'feat/**', 'fix/**']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Test & Lint Codebase
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...
