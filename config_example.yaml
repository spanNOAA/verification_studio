# ==============================================================================
# NOAA GSL Verification Studio — Configuration Example (YAML)
# ==============================================================================
title: "RRFSv2 Model Verification & Performance Evaluation"

# Evaluated models list.
# - id: Actual model experiment identifier in NOAA MATS database (e.g. RRFSv2_conus_3km_ret_v2x_retv4)
# - name: Display alias on slide titles and legends (optional, auto-derived if omitted)
# - cluster & path: Optional remote HPC location for synoptic radar reflectivity graphics
models:
  - id: "RRFSv2_conus_3km_ret_generictquv"
    name: "generictquv"
  - id: "RRFSv2_conus_3km_ret_halfTerr"
    name: "halfTerr"
  - id: "RRFSv2_conus_3km_ret_RRFSv2X_retv3"
    name: "retv3"
  - id: "RRFSv2_conus_3km_ret_v2x_retv4"
    name: "retv4"
    # cluster: "gaeac6"
    # path: "/gpfs/f6/wrfruc/scratch/my_run/cref"

# Verification date ranges (aligned with NOAA MATS database format)
dates:
  surface: "05/06/2024 10:00 - 05/13/2024 00:00"
  upperair: "05/06/2024 00:00 - 05/13/2024 12:00"

# Evaluated domains ("all" for full domain, "east", "west")
regions:
  - "all"

# Output configuration
output_dir: "~/Desktop/Verification_Output"
report_name: "RRFSv2_Verification_Report"

# Pipeline execution options
skip_fetch: false    # Skip chart downloads and rebuild reports directly from local cache
force_fetch: false   # Force re-downloading even if local charts already exist
include_cref: false  # Include synoptic radar composite reflectivity comparison cases
